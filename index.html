<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Triangular Hex Grid — Move Left / Right / Back</title>
    <style>
        :root {
            --bg: #111;
            --card: #0f1720;
            --stroke: #07211a;
            --tri-fill: #ffffff;
            --player: #ffcf33;
            --edge-highlight: #88f;
            --invalid: #d33;
        }

        html, body {
            height: 100%;
            margin: 0;
            background: linear-gradient(180deg,#0b0f12,#081219);
            font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
            color: #ddd
        }

        .wrap {
            display: flex;
            gap: 18px;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .board {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.2));
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
        }

        svg {
            display: block
        }

        .controls {
            max-width: 360px;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.02);
        }

            .controls h2 {
                margin: 2px 0 8px 0;
                font-size: 18px
            }

        .btn-row {
            display: flex;
            gap: 8px;
            margin: 12px 0
        }

        button {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 0;
            background: #163d3a;
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

            button:active {
                transform: translateY(1px)
            }

        .info {
            font-size: 13px;
            color: #a9b7b7
        }

        .legend {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px
        }

            .legend span {
                display: inline-flex;
                align-items: center;
                gap: 8px
            }

        .swatch {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            display: inline-block
        }

        .sw-player {
            background: var(--player)
        }

        .sw-tri {
            background: var(--tri-fill);
            border: 2px solid var(--stroke)
        }

        .sw-possible {
            background: var(--edge-highlight)
        }

        .message {
            margin-top: 12px;
            color: #ffd3a6;
            font-weight: 600
        }

        footer {
            margin-top: 12px;
            font-size: 12px;
            color: #97a7a7
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="board" id="boardContainer">
            <!-- svg will be injected -->
        </div>

        <div class="controls">
            <h2>Controls</h2>
            <div class="info">Select an edge to move.<br><small>For triangles pointing up: Back = down edge. For triangles pointing down: Back = up edge.</small></div>
            <div class="btn-row">
                <button id="leftBtn">← Left</button>
                <button id="backBtn">⤴ Back</button>
                <button id="rightBtn">Right →</button>
            </div>
            <div class="legend">
                <span><i class="swatch" style="background:#7da7d9"></i>Player 1</span>
                <span><i class="swatch" style="background:#ff5e5e"></i>Player 2</span>
            </div>
            <div class="tile legend">
                <span><i class="swatch" style="background:#ff8500"></i>2 Layers left</span>
                <span><i class="swatch" style="background:#ff0000"></i>1 Layer Left</span>
                <span><i class="swatch" style="background:#330f0a"></i>Empty Tile</span>
            </div>
            <div class="message" id="message">Click a direction to move.</div>
            <footer>Grid: 48 triangular tiles arranged in a hex-ish shape.</footer>
        </div>
    </div>

    <script>
        (function () {
            // Configuration
            const rows = [7, 9, 11, 11, 9, 7];
            const side = 60;
            const h = side * Math.sqrt(3) / 2;
            const stroke = 4;

            // Adjusted horizontal spacing for no overlap
            const maxRowLen = Math.max(...rows);
            const svgW = (maxRowLen - 1) * (side * 0.75) + side + 80;
            const svgH = rows.length * h + 160;
            const centerX = svgW / 2;
            const startY = 60;

            const triangles = [];

            // For each row compute starting x to center the row
            const rowYs = [];
            let y = startY;
            const vStep = h * 1.25; // vertical step between centroids
            for (let r = 0; r < rows.length; r++) {
                rowYs.push(y);
                y += vStep;
            }

            // Build triangles
            for (let r = 0; r < rows.length; r++) {
                const n = rows[r];
                // The y position for the base of the triangles in this row
                const baseY = rowYs[r];
                const rowWidth = (n - 1) * (side * 0.75);
                const startX = centerX - rowWidth / 2;
                for (let c = 0; c < n; c++) {
                    const cx = startX + c * (side * 0.75);
                    const rowStartsUp = r < 3;
                    const up = ((c + (rowStartsUp ? 0 : 1)) % 2 === 0);

                    let p1, p2, p3;
                    if (up) {
                        // Base is at baseY, tip is above
                        p1 = [cx - side / 2, baseY + h];
                        p2 = [cx + side / 2, baseY + h];
                        p3 = [cx, baseY];
                    } else {
                        // Base is at baseY, tip is below
                        p1 = [cx - side / 2, baseY];
                        p2 = [cx + side / 2, baseY];
                        p3 = [cx, baseY + h];
                    }

                    triangles.push({
                        id: triangles.length,
                        row: r,
                        col: c,
                        cx, cy: baseY, // you may want to update cy logic if needed elsewhere
                        up,
                        points: [p1, p2, p3],
                        svg: null,
                        layers: 2,
                        isPillar: false,
                        pillarLayers: 0
                    });
                }
            }

            // SVG setup
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("width", svgW);
            svg.setAttribute("height", svgH);
            svg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);
            svg.style.display = 'block';

            const triGroup = document.createElementNS(svgNS, "g");
            triGroup.setAttribute("transform", "translate(0,0)");
            svg.appendChild(triGroup);

            const player1Circle = document.createElementNS(svgNS, "circle");
            player1Circle.setAttribute("r", side * 0.24);
            player1Circle.setAttribute("fill", "#7da7d9");
            player1Circle.setAttribute("stroke", "#000000");
            player1Circle.setAttribute("stroke-width", 3);
            svg.appendChild(player1Circle);

            const player2Circle = document.createElementNS(svgNS, "circle");
            player2Circle.setAttribute("r", side * 0.24);
            player2Circle.setAttribute("fill", "#f69679");
            player2Circle.setAttribute("stroke", "#000000");
            player2Circle.setAttribute("stroke-width", 3);
            svg.appendChild(player2Circle);

            triangles.forEach(t => {
                const poly = document.createElementNS(svgNS, "polygon");
                poly.setAttribute("points", t.points.map(p => p.join(",")).join(" "));
                poly.setAttribute("fill", "white");
                poly.setAttribute("stroke", "#0b1816");
                poly.setAttribute("stroke-width", stroke);
                poly.setAttribute("vector-effect", "non-scaling-stroke");
                poly.style.filter = "drop-shadow(0 2px 2px rgba(0,0,0,0.5))";
                triGroup.appendChild(poly);
                t.svg = poly;
                poly.dataset.id = t.id;
            });

            document.getElementById('boardContainer').appendChild(svg);

            // Centroid map for neighbor lookup
            const centroidMap = new Map();
            function keyFor(x, y) {
                return (Math.round(x * 100) / 100) + "," + (Math.round(y * 100) / 100);
            }
            triangles.forEach(t => {
                centroidMap.set(keyFor(t.cx, t.cy), t.id);
            });

            // Movement vectors
            const leftVec = [-side * 0.75, 0];
            const rightVec = [side * 0.75, 0];
            const backVecUp = [0, h];
            const backVecDown = [0, -h];

            function neighborId(fromId, dir) {
                const t = triangles[fromId];
                let vx = 0, vy = 0;
                if (dir === "left") {
                    vx = -side * 0.75;
                } else if (dir === "right") {
                    vx = side * 0.75;
                } else if (dir === "vertical") {
                    // For up triangles, neighbor is above; for down, neighbor is below
                    vy = t.up ? h * 1.25 : -h * 1.25;
                } else {
                    return null;
                }
                const targetKey = keyFor(t.cx + vx, t.cy + vy);
                return centroidMap.has(targetKey) ? centroidMap.get(targetKey) : null;
            }

            // Player spawn AKA starting position
            let player1Id = 3; // Top of board
            let player2Id = triangles.length - 4; // Bottom of board
            let currentPlayer = 1; // 1 or 2

            let player1Eliminated = false;
            let player2Eliminated = false;

            // Place 3 pillars on non-edge, non-player-start tiles
            const pillarCount = 4;
            const startLayers = 3;
            let placed = 0;
            function isEdgeTile(t) {
                return t.row === 0 || t.row === rows.length - 1 ||
                    t.col === 0 || t.col === rows[t.row] - 1;
            }

            function isValidPillarTile(t) {
                // Not on edge
                if (isEdgeTile(t)) return false;
                // Not on columns 1 or second-to-last column
                if (t.col === 0 || t.col === rows[t.row] - 2) return false;
                // Not already a pillar, not a player start
                if (t.isPillar) return false;
                if (t.id === player1Id || t.id === player2Id) return false;
                // Not adjacent to another pillar
                const neighborIds = [
                    neighborId(t.id, "left"),
                    neighborId(t.id, "right"),
                    neighborId(t.id, "vertical")
                ];
                for (const nid of neighborIds) {
                    if (nid !== null && triangles[nid].isPillar) return false;
                }
                // Not adjacent to edge tile
                for (const nid of neighborIds) {
                    if (nid !== null && isEdgeTile(triangles[nid])) return false;
                }
                return true;
            }

            while (placed < pillarCount) {
                const idx = Math.floor(Math.random() * triangles.length);
                const t = triangles[idx];
                if (isValidPillarTile(t)) {
                    t.isPillar = true;
                    t.pillarLayers = Math.floor(startLayers);
                    placed++;
                }
            }

            let lockedTiles = new Set();

            let highlightedCornerTiles = [];
            let highlightedAdjacentToCorners = [];
            let highlightedSharedOfAdjacent = [];

            function getCurrentPlayerId() {
                return currentPlayer === 1 ? player1Id : player2Id;
            }
            function setCurrentPlayerId(id) {
                if (currentPlayer === 1) player1Id = id;
                else player2Id = id;
            }

            // Compute possible moves for current player
            function getPossibleMoves(id) {
                return ["left", "right", "vertical"]
                    .map(dir => neighborId(id, dir))
                    .filter(nid =>
                        nid !== null &&
                        !lockedTiles.has(nid) &&
                        !triangles[nid].isPillar // Prevent moving onto pillars
                    );
            }

            // Returns array of adjacent pillar IDs with layers > 0
            function getAdjacentPillars(id) {
                return ["left", "right", "vertical"]
                    .map(dir => neighborId(id, dir))
                    .filter(nid => nid !== null && triangles[nid].isPillar && triangles[nid].pillarLayers > 0);
            }

            function getOtherAdjacentTiles(pillarId, playerId) {
                const neighbors = [
                    neighborId(pillarId, "left"),
                    neighborId(pillarId, "right"),
                    neighborId(pillarId, "vertical")
                ];
                // Filter out the player and any nulls
                return neighbors.filter(nid => nid !== null && nid !== playerId);
            }

            function getAdjacentToCornerTiles(pillarId, playerId) {
                const corners = getOtherAdjacentTiles(pillarId, playerId);
                let result = [];
                corners.forEach(cornerId => {
                    getNeighbors(cornerId).forEach(nid => {
                        if (
                            nid !== pillarId &&
                            nid !== playerId &&
                            !corners.includes(nid)
                        ) {
                            result.push(nid);
                        }
                    });
                });
                // Remove duplicates
                return [...new Set(result)];
            }

            function getSharedOfAdjacentTiles(pillarId, playerId) {
                const greenTiles = getAdjacentToCornerTiles(pillarId, playerId);
                const cornerTiles = getCornerTiles(pillarId, playerId);
                const neighborCount = {};
                greenTiles.forEach(greenId => {
                    getNeighbors(greenId).forEach(nid => {
                        // Exclude the pillar, player, green tiles, and corner tiles
                        if (
                            nid !== pillarId &&
                            nid !== playerId &&
                            !greenTiles.includes(nid) &&
                            !cornerTiles.includes(nid)
                        ) {
                            neighborCount[nid] = (neighborCount[nid] || 0) + 1;
                        }
                    });
                });
                // Only include tiles that are neighbors of 2 or more green tiles
                return Object.keys(neighborCount)
                    .filter(nid => neighborCount[nid] > 1)
                    .map(nid => parseInt(nid));
            }

            function getNeighbors(tileId) {
                return ["left", "right", "vertical"]
                    .map(dir => neighborId(tileId, dir))
                    .filter(nid => nid !== null);
            }

            function getCornerTiles(pillarId, playerId) {
                // The two other adjacent tiles are the "corners"
                return getOtherAdjacentTiles(pillarId, playerId);
            }

            // The knockPillar function knocks pillar layers off.
            function knockPillar(playerId, pillarId) {
                const pillar = triangles[pillarId];
                if (!pillar.isPillar || pillar.pillarLayers <= 0) return;

                // Get all three neighbors
                const neighbors = [
                    neighborId(pillarId, "left"),
                    neighborId(pillarId, "right"),
                    neighborId(pillarId, "vertical")
                ];

                // Find which neighbor the player is on
                let playerNeighborIndex = neighbors.indexOf(playerId);

                // Knock a layer off pillar
                pillar.pillarLayers--;
                if (pillar.pillarLayers === 0) {
                    pillar.isPillar = false;
                }

                // Affect the "opposite" tile(s)
                const oppositeTiles = getSharedOfAdjacentTiles(pillarId, playerId);
                oppositeTiles.forEach(oppId => {
                    if (triangles[oppId] && triangles[oppId].layers > 0) {
                        triangles[oppId].layers--;
                        if (triangles[oppId].layers === 0) {
                            lockedTiles.add(oppId);
                        }
                    }

                    // --- Knock back player if present on the hit tile ---
                    let hitPlayer = null;
                    if (player1Id === oppId && !player1Eliminated) hitPlayer = 1;
                    if (player2Id === oppId && !player2Eliminated) hitPlayer = 2;

                    if (hitPlayer) {
                        const knockAdjacentToCorners = getAdjacentToCornerTiles(pillarId, hitPlayer === 1 ? player1Id : player2Id);
                        const neighbors = [
                            neighborId(oppId, "left"),
                            neighborId(oppId, "right"),
                            neighborId(oppId, "vertical")
                        ];
                        // All adjacent tiles (including pillars)
                        const allAdjacents = neighbors.filter(nid =>
                            nid !== null &&
                            !knockAdjacentToCorners.includes(nid) &&
                            player1Id !== nid && player2Id !== nid
                        );
                        // Only non-pillar, non-locked
                        const validAdjacents = allAdjacents.filter(nid =>
                            !lockedTiles.has(nid) &&
                            !triangles[nid].isPillar
                        );
                        // Only pillar tiles
                        const pillarAdjacents = allAdjacents.filter(nid =>
                            triangles[nid].isPillar
                        );

                        if (validAdjacents.length > 0) {
                            const chosen = validAdjacents[Math.floor(Math.random() * validAdjacents.length)];
                            if (hitPlayer === 1) player1Id = chosen;
                            if (hitPlayer === 2) player2Id = chosen;
                        } else if (pillarAdjacents.length > 0) {
                            // Squished by pillar
                            if (hitPlayer === 1) player1Eliminated = true;
                            if (hitPlayer === 2) player2Eliminated = true;
                            // Optionally, move them off the board:
                            if (hitPlayer === 1) player1Id = -1;
                            if (hitPlayer === 2) player2Id = -1;
                            // Show message
                            document.getElementById('message').textContent =
                                `Player ${hitPlayer} was squished by a pillar and is eliminated!`;
                            svg.style.pointerEvents = "none";
                        } else {
                            // Knocked off the board
                            if (hitPlayer === 1) player1Eliminated = true;
                            if (hitPlayer === 2) player2Eliminated = true;
                            if (hitPlayer === 1) player1Id = -1;
                            if (hitPlayer === 2) player2Id = -1;
                            document.getElementById('message').textContent =
                                `Player ${hitPlayer} was knocked off the board and is eliminated!`;
                            svg.style.pointerEvents = "none";
                        }
                    }
                    // --- End knockback ---
                });
                render();
            }

            // UI: Knock Pillar Button (create only once)
            let knockBtn = document.createElement("button");
            knockBtn.textContent = "Knock Pillar";
            knockBtn.style.display = "none";
            knockBtn.onclick = function () {
                const playerId = getCurrentPlayerId();
                const adjPillars = getAdjacentPillars(playerId);
                if (adjPillars.length > 0) {
                    // For simplicity, knock the first adjacent pillar
                    knockPillar(playerId, adjPillars[0]);
                    // Switch turn after knocking
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    render();
                }
            };
            document.querySelector('.controls').insertBefore(knockBtn, document.getElementById('message'));

            // Render player and highlights
            function render() {
                // 1. Clear all highlight classes
                triangles.forEach(t => {
                    t.svg.classList.remove("possible-move");
                    t.svg.classList.remove("corner-highlight");
                    t.svg.classList.remove("adjacent-corner-highlight");
                    t.svg.classList.remove("shared-adjacent-highlight");
                });

                // 2. Set base fill and pillar/locked/layer logic
                triangles.forEach(t => {
                    t.svg.setAttribute("stroke", "#000000");
                    t.svg.setAttribute("opacity", "1");
                    if (t.isPillar) {
                        let color = "#8393ca";
                        if (t.pillarLayers === 3) color = "#82ca9c";
                        else if (t.pillarLayers === 2) color = "#6dcff6";
                        else if (t.pillarLayers === 1) color = "#8393ca";
                        t.svg.setAttribute("fill", color);

                        if (!t.textEl) {
                            t.textEl = document.createElementNS(svgNS, "text");
                            t.textEl.setAttribute("x", t.cx);
                            t.textEl.setAttribute("y", t.cy + 30);
                            t.textEl.setAttribute("text-anchor", "middle");
                            t.textEl.setAttribute("font-size", "22");
                            t.textEl.setAttribute("fill", "#fff");
                            svg.appendChild(t.textEl);
                        }
                        t.textEl.textContent = t.pillarLayers;
                        t.textEl.style.display = "";
                    } else {
                        if (t.textEl) t.textEl.style.display = "none";
                        if (lockedTiles.has(t.id)) {
                            t.svg.setAttribute("fill", "#330f0a");
                        } else if (t.layers === 2) {
                            t.svg.setAttribute("fill", "#ff8500");
                        } else if (t.layers === 1) {
                            t.svg.setAttribute("fill", "#ff0000");
                        }
                    }
                });

                // 3. Highlight possible moves for current player
                getPossibleMoves(getCurrentPlayerId()).forEach(nid => {
                    if (nid !== player1Id && nid !== player2Id) {
                        const t = triangles[nid];
                        t.svg.setAttribute("fill", "#fff875");
                        t.svg.classList.add("possible-move");
                    }
                });

                // 4. Show knock button if adjacent to pillar and update highlightedCornerTiles
                const adjPillars = getAdjacentPillars(getCurrentPlayerId());
                knockBtn.style.display = adjPillars.length > 0 ? "" : "none";
                if (adjPillars.length > 0) {
                    highlightedCornerTiles = getCornerTiles(adjPillars[0], getCurrentPlayerId());
                    highlightedAdjacentToCorners = getAdjacentToCornerTiles(adjPillars[0], getCurrentPlayerId());
                    highlightedSharedOfAdjacent = getSharedOfAdjacentTiles(adjPillars[0], getCurrentPlayerId());
                } else {
                    highlightedCornerTiles = [];
                    highlightedAdjacentToCorners = [];
                    highlightedSharedOfAdjacent = [];
                }

                // 5. Highlight corner tiles (do this last!)                
                highlightedSharedOfAdjacent.forEach(id => {
                    if (triangles[id] && triangles[id].svg) {
                        triangles[id].svg.setAttribute("fill", "#ff6e6e"); // pink highlight
                        triangles[id].svg.classList.add("shared-adjacent-highlight");
                    }
                });

                // 6. Position player pieces
                if (!player1Eliminated && player1Id >= 0) {
                    const t1 = triangles[player1Id];
                    player1Circle.setAttribute("cx", t1.cx);
                    player1Circle.setAttribute("cy", t1.cy + 22);
                    player1Circle.style.display = "";
                } else {
                    player1Circle.style.display = "none";
                }
                if (!player2Eliminated && player2Id >= 0) {
                    const t2 = triangles[player2Id];
                    player2Circle.setAttribute("cx", t2.cx);
                    player2Circle.setAttribute("cy", t2.cy + 22);
                    player2Circle.style.display = "";
                } else {
                    player2Circle.style.display = "none";
                }

                // 7. Message
                const p = triangles[getCurrentPlayerId()];

                if (player1Eliminated) {
                    document.getElementById('message').textContent = "Player 2 wins! Player 1 has been eliminated.";
                    svg.style.pointerEvents = "none";
                    return;
                }
                if (player2Eliminated) {
                    document.getElementById('message').textContent = "Player 1 wins! Player 2 has been eliminated.";
                    svg.style.pointerEvents = "none";
                    return;
                }

                document.getElementById('message').textContent =
                    `Player ${currentPlayer}'s turn. You are on tile #${getCurrentPlayerId() + 1} (row ${p.row + 1}, col ${p.col + 1}). Click a highlighted tile to move.`;
            }

            // Click handler for movement
            svg.addEventListener('click', (ev) => {
                const pt = ev.target;
                if (pt.tagName === "polygon") {
                    const id = parseInt(pt.dataset.id);
                    if ((id === player1Id || id === player2Id)) return;
                    if (!isNaN(id) && getPossibleMoves(getCurrentPlayerId()).includes(id)) {
                        // Decrement the layer count of the previous tile
                        const prevId = getCurrentPlayerId();
                        triangles[prevId].layers = Math.max(0, triangles[prevId].layers - 1);
                        // Only lock the tile if all layers are gone
                        if (triangles[prevId].layers === 0) {
                            lockedTiles.add(prevId);
                        }
                        setCurrentPlayerId(id);
                        // Switch turn
                        currentPlayer = currentPlayer === 1 ? 2 : 1;

                        // Check if the next player has any moves
                        const canKnockPillar = getAdjacentPillars(getCurrentPlayerId()).length > 0;
                        if (getPossibleMoves(getCurrentPlayerId()).length === 0 && !canKnockPillar) {
                            // The next player cannot move, so the previous player wins
                            //const winner = currentPlayer === 1 ? 2 : 1;
                            if (currentPlayer === 1) {
                                player1Eliminated = true;
                            }
                            else {
                                player2Eliminated = true;
                            }
                            /*
                            render();
                            document.getElementById('message').textContent =
                                `Player ${winner} wins! Player ${currentPlayer} has no available moves.`;
                            // Optionally, disable further moves
                            svg.style.pointerEvents = "none";
                            return;
                            */
                        }
                        render();
                    }
                }
            });

            // Initial render
            render();

            // Remove movement buttons and update info
            document.querySelector('.btn-row').style.display = 'none';
            document.querySelector('.info').innerHTML = "Click a highlighted tile to move.<br><small>Only adjacent tiles are allowed.</small>";

        })();
    </script>

</body>
</html>
